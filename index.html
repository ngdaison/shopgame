<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIYOVN</title>
  <style>
    :root {
      --bg-1: #f5f7fb;
      --bg-2: #e9eef7;
      --card: rgba(255, 255, 255, 0.78);
      --line: rgba(20, 30, 50, 0.08);
      --text: #0f172a;
      --muted: #475569;
      --accent: #1d4ed8;
      --accent-2: #0f766e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: "Segoe UI", Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(29, 78, 216, 0.08), transparent 35%),
        radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.08), transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .hero {
      width: min(1100px, 100%);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 64px 56px;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .hero::before {
      width: 280px;
      height: 280px;
      top: -120px;
      right: -80px;
      background: radial-gradient(circle, rgba(29, 78, 216, 0.14), transparent 70%);
    }

    .hero::after {
      width: 240px;
      height: 240px;
      bottom: -100px;
      left: -70px;
      background: radial-gradient(circle, rgba(15, 118, 110, 0.14), transparent 70%);
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(29, 78, 216, 0.12);
      background: rgba(255, 255, 255, 0.72);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(42px, 8vw, 96px);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .divider {
      width: 110px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      margin: 8px 0 6px;
    }

    .sub {
      font-size: clamp(19px, 2.2vw, 32px);
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .sub.en {
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 600;
      color: #334155;
    }

    .sub.group {
      font-size: clamp(18px, 2.1vw, 30px);
      font-weight: 700;
      color: #1e293b;
    }

    @media (max-width: 768px) {
      .hero {
        padding: 42px 26px;
        border-radius: 22px;
      }

      .content {
        gap: 14px;
      }

      .divider {
        width: 88px;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="content">
      <div class="tag">Corporate Identity</div>

      <h1>TẬP ĐOÀN KYO VIỆT NAM</h1>

      <div class="divider"></div>

      <div class="sub">CÔNG TY CỔ PHẦN KIYOVN</div>
      <div class="sub en">KIYOVN JOINT STOCK COMPANY</div>
      <div class="sub group">KIYOVN GROUP</div>
    </div>
  </section>
</body>
</html>
